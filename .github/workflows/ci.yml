name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Static audit
        run: python tests/static-audit.py
      - name: Deploy config
        run: python tests/deploy-check.py
      - name: Payments logic
        run: npm run test:payments
      - name: Browser suites
        run: |
          python tests/browser-smoke.py
          python tests/actions-test.py
          python tests/flows-mock.py
          python tests/mobile-audit.py
